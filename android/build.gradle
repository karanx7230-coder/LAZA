buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath ("com.google.gms:google-services:4.4.4")
    }
}

allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.android.gms' &&
                details.requested.name == 'play-services-location') {
                details.useVersion('21.3.0')
                details.because('override react-native-geolocation-service strict pin (18.0.0), align with Firebase BoM 34.14.0 / play-services-auth 21.5.0')
            }
        }
    }
}
apply plugin: "com.facebook.react.rootproject"
